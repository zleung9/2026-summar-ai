[project]
name = "ai-beginner-2026"
version = "0.1.0"
description = "Shared Python environment for the AI Native Machine Learning Engineer course"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.0",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "openpyxl>=3.1",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "seaborn>=0.13",
    "torch>=2.8",
    "torchvision>=0.23",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv]
package = false
